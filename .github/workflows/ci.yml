# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust 검사
    runs-on: windows-latest   # Windows API 의존 — ubuntu 사용 불가
    steps:
      - uses: actions/checkout@v7

      - name: Rust stable 설치
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 포맷 검사
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: 타입 검사
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: 린트 (경고 = 실패)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: 단위 테스트
        run: cargo test --manifest-path src-tauri/Cargo.toml

  frontend:
    name: 프론트엔드 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 설치
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: pnpm 설치
        uses: pnpm/action-setup@v6
        with:
          # 로컬 개발 환경과 동일한 버전으로 고정한다. 버전이 어긋나면
          # 플래그 해석이 달라져 로컬에서 통과한 명령이 CI 에서 깨진다.
          version: 10.33.2

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 린트 (경고 = 실패)
        run: pnpm eslint src --ext .ts,.tsx --max-warnings 0

      # `tsc --noEmit` 은 루트 tsconfig.json 이 files:[] + references 뿐이라
      # 아무 파일도 검사하지 않는다(무의미한 통과). 실제 빌드와 동일하게
      # `tsc -b` + vite build 를 돌려서 타입 오류와 번들 오류를 모두 잡는다.
      - name: 빌드 (타입 검사 포함)
        run: pnpm build

      # `pnpm test --run` 은 pnpm 버전에 따라 --run 을 pnpm 자신의 옵션으로
      # 해석해 실패한다(pnpm 9: "Unknown option: 'run'"). vitest 를 직접 호출한다.
      - name: 단위 테스트
        run: pnpm vitest run

      # 커버리지 하한선(래칫). 목표는 70% 지만 현재 9.1% 라 한 번에 못 올린다.
      # 회귀 방지용으로 현재 수준에 걸어두고, 테스트를 추가할 때마다 이 숫자를 올린다.
      # 전체 수치는 미테스트 대형 UI 파일(VtScanner.tsx 393줄, reportPdf.ts 229줄 등)이
      # 분모를 지배한다. 크게 올리려면 그쪽에 테스트가 필요하다.
      - name: 커버리지 확인
        run: pnpm vitest run --coverage --coverage.thresholds.lines=9
