[package]
name = "winguard"
version = "0.1.0"
edition = "2021"
description = "WinGuard — personal Windows security check tool"
authors = ["WinGuard"]
license = "MIT"

[[bin]]
name = "winguard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "multipart", "native-tls"] }
sha2 = "0.10"
keyring = "2"
chrono = { version = "0.4", features = ["serde"] }
llama-cpp-2 = { version = "0.1", default-features = false }
encoding_rs = "0.8"
dirs = "5"
tokio = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
